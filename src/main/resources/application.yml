server:
  port: 8096
  servlet:
    context-path: /

spring:
  application:
    name: mana-community-safety-network
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/manacommunity}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:9a4f8c2e1b6d3a7e5f8b0c4d2e9f1a3b5c7d9e1f3a5b7c9d1e3f5a7b9c1d3e5f}
    expiration-ms: 86400000
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://localhost:8080"
      - "http://localhost:8096"

safety:
  visitor:
    overstay-threshold-hours: 8
    default-pass-validity-hours: 12
  parking:
    default-violation-fine: 500.00
  gate:
    emergency-open-duration-minutes: 30
